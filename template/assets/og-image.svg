<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf9" />
      <stop offset="55%" stop-color="#f9f1e8" />
      <stop offset="100%" stop-color="#ece7f5" />
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#ffecc6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffecc6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <g fill="#3a2f2d">
    <text x="600" y="240" text-anchor="middle" font-size="74" font-family="Amiri, serif">بَيَان</text>
    <text x="600" y="340" text-anchor="middle" font-size="72" letter-spacing="12" font-family="Cormorant Garamond, serif">BAYANE</text>
    <text x="600" y="414" text-anchor="middle" font-size="34" font-family="Cormorant Garamond, serif">Par la grâce de Dieu, nous avons accueilli notre fille</text>
  </g>
